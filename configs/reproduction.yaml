  evidence_sources:
    - "CVE"
    - "NVD"
    - "EPSS"
    - "MITRE ATT&CK"
    - "CAPEC"
    - "CISA KEV"
    - "MISP"
    - "VirusTotal"
    - "AlienVault OTX"
    - "Vendor advisories"
    - "CERT bulletins"
    - "Advisory-linked detection-rule repositories"

  # Evidence manifests must assign explicit EvidenceRole values:
  # model_input, reference_only, or outcome_reference.
  #
  # Source roles:
  # CVE/NVD: vulnerability IDs, affected systems, CVSS, temporal metadata.
  # EPSS: time-indexed exploitation-likelihood reference estimates.
  # ATT&CK/CAPEC: techniques, patterns, relationships, mitigation mappings.
  # CISA KEV: known-exploitation evidence.
  # MISP: IOC-malware-actor relationships.
  # VirusTotal: malware labels, behavior, infrastructure evidence.
  # OTX: campaign-linked IOC collections.
  # Vendor/CERT advisories: affected-system, patch, mitigation references.
  # Advisory-linked repositories: detection-rule reference artifacts.
  #
  # These roles do not resolve access tiers, releases, source precedence,
  # historical availability, or the actual selected evidence records.
  evidence_manifest: null
  historical_snapshot_manifest: null
  task_conversion_manifest: null
  reference_answer_manifest: null

  preprocessing:
    normalize_identifiers: true
    align_prediction_chronology: true
    construct_reference_entity_mappings: true
    preserve_source_provenance: true
    alias_table_version: null
    taxonomy_versions: null
    deduplication_policy: null

  # Approximately 54,100 task assignments, not necessarily unique cases.
  # Retain distinct tasks derived from the same underlying case.
  task_counts_are_approximate: true
  task_counts_may_overlap: true

