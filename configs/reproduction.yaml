  calibration:
    instances: 45
    cover_four_stages: true
    cover_three_high_level_categories: true
    independent_initial_annotation: true
    discuss_disagreements: true
    exclude_from_agreement_statistics: true
    freeze_guideline_before_formal_reliability_study: true

  agreement_study:
    instances: 320
    annotators_per_instance: 3
    stratify_by:
      - "cti_stage"
      - "failure_category"
    preserve_independent_labels: true
    metrics:
      - "krippendorff_alpha_per_binary_subtype"
      - "macro_krippendorff_alpha"
      - "exact_label_set_agreement"
    uncertain_label_handling: null

  adjudication:
    review_reference_evidence: true
    apply_frozen_inclusion_exclusion_criteria: true
    escalate_unresolved_cases_to_senior: true
    use_adjudicated_labels_for_agreement_statistics: false

audits:
  failure_identification:
    instances: 100
    sampling: "simple_random_without_replacement"
    population: "automatically_labeled_responses"
    sampling_seed: null
    exclude:
      - "human_anchors"
      - "calibration_examples"
      - "previously_manually_reviewed_cases"
      - "duplicate_records"
    independent_annotators: 2
    disagreement_adjudicator: true
    blind_to:
      - "identification_scores"
      - "automatic_assignments"
      - "other_annotator_decisions"
    freeze_identification_before_sampling: true
    use_audit_labels_for_tuning: false
    positive_class: "failure"
    metrics: ["precision", "recall", "f1"]
    zero_denominator_result: "N/A"

  failure_categorization:
    original_agreement_instances: 320
    additional_instances: 480
    total_instances: 800
    additional_sampling_protocol: null
    include_stable_consensus_cases: true
    independent_human_references: true
    evaluate_predictions_before_human_correction: true
    count_audit_work_as_operational_verification: false
    metrics:
