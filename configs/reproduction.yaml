# Reproduction configuration template for ExperimentConfig.load(path).
# Python types and stage-readiness checks are defined in schemas.py/config.py.
#
# null is an explicit unresolved default, NOT permission to use a library default.
# Fill in the null settings required by a stage before executing it.
# Do not use reported results to populate labels, thresholds, or sampling choices.
#
# Relative artifact paths, when supplied, resolve relative to THIS file.
# Do not serialize credentials, API keys, or credential-bearing URLs.
# config_hash is derived by config.py and must not be entered here.

experiment_id: null
corpus_version: null

# Engineering declarations accepted by the existing ExperimentConfig interface.
# No filesystem locations or execution subsets have been selected.
operational:
  database_path: null
  artifact_root: null
  output_path: null

  # null retains the full declared inventory; it does not resolve missing inputs.
  selected_tasks: null
  selected_models: null
  selected_benchmarks: null
  selected_baseline: null
  selected_ablation: null
  selected_defense: null
  selected_mitigation_mode: null
  selected_audit: null
  taxonomy_mode: null

  # Populate only with actual, frozen artifacts for the requested stage.
  # Accepted prerequisite names depend on the stage: corpus, references,
  # responses, identification, taxonomy, predictions, audit_sampling,
  # results, and scoring. An empty mapping supplies none of these.
  prerequisite_manifests: {}

  # Dotted configuration path -> required | not_applicable.
  # A not_applicable entry requires matching implementation-choice provenance
  # and cannot waive a scientifically mandatory prerequisite.
  applicability: {}

  # Dotted artifact-reference path -> lowercase SHA-256 digest.
  # Local referenced files are also hashed by ExperimentConfig.load().
  artifact_hashes: {}

# Dotted configuration path -> explicit provenance record.
# Leave empty until a real resolution has been made. Each record requires:
# configuration_path, origin (author_specified | implementation),
# rationale, affected_experiments, and selected_value, manifest_reference,
# or applicability. author_specified additionally requires source.
# Never place credentials in a provenance record.
implementation_choices: {}

study:
  title: "Uncovering Vulnerabilities of LLM-Assisted Cyber Threat Intelligence"
  execution_mode: "inference_and_analysis"
  random_seed: null

training:
  # No training or fine-tuning is part of the reported experiments.
  required: false
  learning_rate: null
  batch_size: null
  epochs: null
  optimizer: null
  weight_decay: null
  learning_rate_scheduler: null
  gradient_accumulation_steps: null

data:
